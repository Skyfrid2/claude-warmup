name: Claude Code Warmup

on:
  workflow_dispatch:

concurrency:
  group: claude-warmup
  cancel-in-progress: true

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate configuration
        env:
          CLAUDE_TEAM_A_OAUTH_TOKEN: ${{ secrets.CLAUDE_TEAM_A_OAUTH_TOKEN }}
          CLAUDE_TEAM_B_OAUTH_TOKEN: ${{ secrets.CLAUDE_TEAM_B_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_TEAM_A_OAUTH_TOKEN}" ]; then
            echo "CLAUDE_TEAM_A_OAUTH_TOKEN secret is not set."
            exit 1
          fi

          if [ -z "${CLAUDE_TEAM_B_OAUTH_TOKEN}" ]; then
            echo "CLAUDE_TEAM_B_OAUTH_TOKEN secret is not set."
            exit 1
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Warmup Organization A
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_TEAM_A_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json

          output_file="$(mktemp)"

          set +e
          claude -p "hi" --model haiku --no-session-persistence >"$output_file" 2>&1
          status=$?
          set -e

          cat "$output_file"

          if [ $status -eq 0 ]; then
            echo "✓ Organization A warmup succeeded."
            exit 0
          fi

          if grep -Eiq "expired|unauthorized|invalid token|authentication|auth failed|login required|not logged in" "$output_file"; then
            echo "Organization A token appears invalid or expired."
            exit 1
          fi

          if grep -qi "rate limit" "$output_file"; then
            echo "Organization A reported a rate limit; treating as warmup success."
            exit 0
          fi

          echo "Organization A warmup failed."
          exit $status

      - name: Warmup Organization B
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_TEAM_B_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json

          output_file="$(mktemp)"

          set +e
          claude -p "hi" --model haiku --no-session-persistence >"$output_file" 2>&1
          status=$?
          set -e

          cat "$output_file"

          if [ $status -eq 0 ]; then
            echo "✓ Organization B warmup succeeded."
            exit 0
          fi

          if grep -Eiq "expired|unauthorized|invalid token|authentication|auth failed|login required|not logged in" "$output_file"; then
            echo "Organization B token appears invalid or expired."
            exit 1
          fi

          if grep -qi "rate limit" "$output_file"; then
            echo "Organization B reported a rate limit; treating as warmup success."
            exit 0
          fi

          echo "Organization B warmup failed."
          exit $status
